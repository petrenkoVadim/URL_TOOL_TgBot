# fly.toml app configuration file generated for url-tool-tgbot-3brotw on 2026-09-23T14:15:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'url-tool-tgbot-3brotw'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
